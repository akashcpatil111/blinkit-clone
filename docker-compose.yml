version: '3.8'

services:
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  user_service:
    build: ./services/user_service
    ports:
      - "8001:8001"
    environment:
      - MONGO_URI=mongodb://mongo:27017/blinkit_commerce
      - SECRET_KEY=supersecretkey
    depends_on:
      - mongo

  product_service:
    build: ./services/product_service
    ports:
      - "8002:8002"
    environment:
      - MONGO_URI=mongodb://mongo:27017/blinkit_commerce
    depends_on:
      - mongo

  order_service:
    build: ./services/order_service
    ports:
      - "8003:8003"
    environment:
      - MONGO_URI=mongodb://mongo:27017/blinkit_commerce
    depends_on:
      - mongo

  delivery_service:
    build: ./services/delivery_service
    ports:
      - "8004:8004"
    environment:
      - MONGO_URI=mongodb://mongo:27017/blinkit_commerce
    depends_on:
      - mongo

volumes:
  mongo_data:
